services:
  pdf-agent:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      PDF_AGENT_DATA_DIR: /data
      CORS_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    volumes:
      - pdf-agent-data:/data
    restart: unless-stopped

volumes:
  pdf-agent-data:
