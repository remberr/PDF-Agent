name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # A paid opt-in flag or accidentally configured Key cannot override CI isolation.
  PDF_AGENT_DISABLE_LLM_API: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.api.txt

      - name: Install CPU-only PyTorch
        run: >-
          python -m pip install torch==2.7.0
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        run: python -m pip install -r requirements.api.txt

      - name: Run backend tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run agent routing evaluation
        run: >-
          python -m evaluation.runner
          --mode routing
          --output evaluation-report.json

  postgres-integration:
    name: Local PostgreSQL and pgvector integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: pdf_agent
          POSTGRES_DB: pdf_agent_test
          # Disposable loopback CI database only, never deployment configuration.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55433:5432
        options: >-
          --health-cmd "pg_isready -U pdf_agent -d pdf_agent_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pdf_agent@127.0.0.1:55433/pdf_agent_test
      PDF_AGENT_RUN_POSTGRES_TESTS: "1"
      PDF_AGENT_RUN_LEGACY_RECOVERY_TESTS: "1"
      PDF_AGENT_RUN_PAID_TESTS: "0"
      PDF_AGENT_RUN_CACHE_API_TESTS: "0"
      PDF_AGENT_RUN_LOCAL_PDF_TESTS: "0"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.api.txt
            requirements.migration.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.migration.txt
      - name: Test real PostgreSQL storage and offline regressions
        run: python -m unittest discover -s tests -t . -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test workflow cache display
        run: npm test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - backend-tests
      - frontend-build
      - postgres-integration

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pdf-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
