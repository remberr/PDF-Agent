services:
  pdf-agent:
    image: pdf-agent:latest
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Pass optional overrides only when set; blank defaults invalidate pricing.
      LLM_CACHE_HIT_COST_PER_1M_TOKENS:
      LLM_CACHE_MISS_COST_PER_1M_TOKENS:
      LLM_OUTPUT_COST_PER_1M_TOKENS:
      PDF_AGENT_DATA_DIR: /data
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SESSION_CLEANUP_INTERVAL_SECONDS: ${SESSION_CLEANUP_INTERVAL_SECONDS:-3600}
      CORS_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
    volumes:
      - pdf-agent-data:/data
    restart: unless-stopped

volumes:
  pdf-agent-data:
