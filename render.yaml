services:
  - type: web
    name: pdf-agent
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: LOG_LEVEL
        value: INFO
      - key: PDF_AGENT_DATA_DIR
        value: /data
      - key: SESSION_TTL_SECONDS
        value: "86400"
      - key: SESSION_CLEANUP_INTERVAL_SECONDS
        value: "3600"
    disk:
      name: pdf-agent-data
      mountPath: /data
      sizeGB: 1
