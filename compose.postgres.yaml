# Standalone opt-in development DB. Does not start or reconfigure the SQLite app.
name: pdf-agent-postgres-dev
services:
  db:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_USER: pdf_agent
      POSTGRES_DB: pdf_agent_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf_agent -d pdf_agent_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  postgres-data:
